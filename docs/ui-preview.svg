<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Neural Quantum Annealing web UI preview</title>
  <desc id="desc">Stylised illustration of the Neural Quantum Annealing web interface showing the upload form, theme toggle, and job list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f9fbff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="secondary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5ff"/>
      <stop offset="100%" stop-color="#e0ebff"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-16%" width="140%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#184479" flood-opacity="0.18"/>
    </filter>
    <style type="text/css"><![CDATA[
      .title { font: 600 28px "Inter", "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: -0.01em; }
      .subtitle { font: 400 16px "Inter", "Segoe UI", sans-serif; fill: #5f6b84; }
      .label { font: 600 12px "Inter", "Segoe UI", sans-serif; fill: #2563eb; letter-spacing: 0.12em; text-transform: uppercase; }
      .field-title { font: 600 16px "Inter", "Segoe UI", sans-serif; fill: #0f172a; }
      .field-line { font: 500 13px "Inter", "Segoe UI", sans-serif; fill: #475569; }
      .math { font: 500 13px "Inter", "Segoe UI", sans-serif; fill: #1f2937; }
      .job-title { font: 600 14px "Inter", "Segoe UI", sans-serif; fill: #0f172a; }
      .job-meta { font: 500 12px "Inter", "Segoe UI", sans-serif; fill: #5f6b84; }
      .job-pill { font: 600 12px "Inter", "Segoe UI", sans-serif; fill: #1d4ed8; }
      .button-text { font: 600 14px "Inter", "Segoe UI", sans-serif; fill: #ffffff; }
    ]]></style>
  </defs>
  <rect width="960" height="620" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="90" fill="#2563eb" fill-opacity="0.08"/>
  <circle cx="760" cy="80" r="110" fill="#14b8a6" fill-opacity="0.07"/>
  <g filter="url(#shadow)">
    <rect x="140" y="90" width="680" height="460" rx="26" fill="url(#panel)"/>
  </g>
  <rect x="158" y="108" width="644" height="96" rx="20" fill="#ffffff" stroke="#dde6ff"/>
  <text class="title" x="188" y="150">Neural Quantum Annealing Server</text>
  <text class="subtitle" x="188" y="182">Upload Ising / QUBO inputs, tune study options, and monitor runs.</text>
  <g transform="translate(704 126)">
    <rect width="54" height="54" rx="27" fill="#ffffff" stroke="#d7e2fb"/>
    <text x="27" y="35" text-anchor="middle" font-size="20" font-family="Inter, "Segoe UI", sans-serif">☀</text>
  </g>
  <g transform="translate(188 228)">
    <rect width="282" height="198" rx="18" fill="#ffffff" stroke="#dde6ff"/>
    <text class="label" x="22" y="36">TRANSVERSE-FIELD SK</text>
    <text class="math" x="22" y="66">H = Σᵢⱼ Jᵢⱼ σᶻᵢ σᶻⱼ + Σᵢ hᵢ σᶻᵢ − Σᵢ gᵢ σˣᵢ</text>
    <g transform="translate(22 88)">
      <rect width="240" height="34" rx="10" fill="#eff3fb"/>
      <text class="field-line" x="16" y="22">J matrix (.npy)</text>
    </g>
    <g transform="translate(22 132)">
      <rect width="240" height="34" rx="10" fill="#eff3fb"/>
      <text class="field-line" x="16" y="22">h vector (.npy, optional)</text>
    </g>
    <g transform="translate(22 176)">
      <rect width="240" height="34" rx="10" fill="#eff3fb"/>
      <text class="field-line" x="16" y="22">g vector (.npy, optional)</text>
    </g>
  </g>
  <g transform="translate(480 228)">
    <rect width="282" height="198" rx="18" fill="#ffffff" stroke="#dde6ff"/>
    <text class="label" x="22" y="36">QUBO PROBLEM</text>
    <text class="math" x="22" y="66">f(x) = Σᵢⱼ Qᵢⱼ xᵢ xⱼ, xᵢ ∈ {0, 1}</text>
    <g transform="translate(22 88)">
      <rect width="240" height="34" rx="10" fill="#eff3fb"/>
      <text class="field-line" x="16" y="22">QUBO matrix (.npy)</text>
    </g>
    <g transform="translate(22 132)">
      <rect width="240" height="34" rx="10" fill="#eff3fb"/>
      <text class="field-line" x="16" y="22">Study overrides (JSON)</text>
    </g>
    <g transform="translate(22 176)">
      <rect width="140" height="34" rx="12" fill="url(#primary)"/>
      <text class="button-text" x="70" y="22">Submit job</text>
    </g>
  </g>
  <g transform="translate(188 446)">
    <rect width="574" height="86" rx="18" fill="#ffffff" stroke="#dde6ff"/>
    <text class="label" x="22" y="38">JOB STATUS FEED</text>
    <text class="job-title" x="22" y="64">Job #4 — DONE</text>
    <text class="job-meta" x="22" y="82">created: 2024-03-12 · download results · open dashboard</text>
    <g transform="translate(432 42)">
      <rect width="112" height="32" rx="16" fill="url(#secondary)"/>
      <text class="job-pill" x="56" y="22" text-anchor="middle">optuna db</text>
    </g>
  </g>
</svg>
