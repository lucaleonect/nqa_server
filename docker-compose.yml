services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./services/api
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      DATA_ROOT: /data
    volumes:
      - shared-data:/data
    ports:
      - "8000:8000"

  spark-master:
    image: bitnami/spark:4.0.0
    environment:
      - SPARK_MODE=master
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - shared-data:/data
      - ./services/solver:/app/solver:ro

  spark-gpu-worker-1:
    build: ./services/spark-gpu-worker   # ⬅ build the GPU worker image here
    environment:
      SPARK_MASTER_URL: "spark://spark-master:7077"
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    volumes:
      - shared-data:/data
      - ./services/solver:/solver:ro
    runtime: nvidia
    gpus: all
    depends_on:
      - spark-master

  scheduler:
    build: ./services/scheduler
    depends_on:
      - db
      - spark-master
      - spark-gpu-worker-1
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SPARK_MASTER_URL: "spark://spark-master:7077"
      DATA_ROOT: /data
    volumes:
      - shared-data:/data
      - ./services/solver:/app/solver:ro
      - ./services/scheduler/spark_job_gpu.py:/app/spark_job_gpu.py:ro

volumes:
  pgdata:
  shared-data:
