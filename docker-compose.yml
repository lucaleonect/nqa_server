services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./services/api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_ROOT: /data
    volumes:
      - shared-data:/data
    ports:
      - "8000:8000"
      - "8001:8001"

  scheduler:
    build: ./services/scheduler
    depends_on:
      - db
      - solver
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SOLVER_URL: "http://solver:8081"
      DATA_ROOT: /data
    volumes:
      - shared-data:/data

  solver:
    build: ./services/solver
    environment:
      DATA_ROOT: /data
      NQA_MASTER_SCRIPT: /nqa/nqa/master.py
    gpus: all
    volumes:
      - shared-data:/data
    ports:
      - "8081:8081"

volumes:
  pgdata:
  shared-data:
