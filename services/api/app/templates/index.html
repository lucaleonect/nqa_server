<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>nqa-server</title>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 1.5rem;
            color: #2e2e2e;
            max-width: 960px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        fieldset {
            border: 1px solid #d0d7de;
            border-radius: 10px;
            padding: 1.1rem 1.2rem;
        }

        legend {
            font-weight: 600;
            padding: 0 0.4rem;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        input[type="file"],
        input[type="text"],
        input[type="number"] {
            font-size: 0.95rem;
            padding: 0.4rem 0.55rem;
            border: 1px solid #bfc3c8;
            border-radius: 6px;
            background: #fff;
        }

        button {
            align-self: flex-start;
            padding: 0.55rem 1.2rem;
            font-size: 0.95rem;
            border-radius: 999px;
            border: 1px solid #0969da;
            background: #0969da;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #ffffff;
        }

        .hint {
            color: #ffffff;
            font-size: 0.88rem;
            margin-top: -0.4rem;
        }

        .job {
            border: 1px solid #d0d7de;
            border-radius: 10px;
            padding: 0.8rem 1.1rem;
            margin: 0.45rem 0;
            font-size: 0.92rem;
        }

        .job strong {
            font-size: 1rem;
        }

        code {
            background: #f6f8fa;
            padding: 0.18rem 0.35rem;
            border-radius: 4px;
        }

        @media (max-width: 620px) {
            body {
                margin: 1rem;
            }
        }
    </style>
</head>

<body>
    <h1>nqa-server</h1>
    <form id="uploadForm">
        <fieldset>
            <legend>Problem instance</legend>
            <label>
                J matrix (.npy, required)
                <input type="file" name="file" accept=".npy" required />
            </label>
            <label>
                h vector (.npy, optional)
                <input type="file" name="h_vector" accept=".npy" />
            </label>
            <label>
                g vector (.npy, optional)
                <input type="file" name="g_vector" accept=".npy" />
            </label>
            <p class="hint">Leave optional vectors blank for zero fields. Studies run with default Optuna settings.</p>
        </fieldset>

        <button type="submit">Start study</button>
    </form>

    <p id="msg"></p>

    <h2>Jobs</h2>
    <div id="jobs"></div>

    <script>
        const jobsDiv = document.getElementById('jobs');
        const msg = document.getElementById('msg');

        const maybeDeleteEmptyFile = (form, formData, name) => {
            const input = form.querySelector(`input[name="${name}"]`);
            if (!input) return;
            const file = input.files && input.files[0];
            if (!file || !file.name || file.size === 0) {
                formData.delete(name);
            }
        };

        async function refresh() {
            const res = await fetch('/jobs');
            const data = await res.json();
            jobsDiv.innerHTML = '';
            data.forEach(job => {
                const el = document.createElement('div');
                el.className = 'job';
                el.innerHTML = `
                    <strong>${job.id}</strong><br/>
                    study: <code>${job.study_name}</code> &nbsp; status: <code>${job.status}</code> &nbsp; source: ${job.filename}<br/>
                    created: ${job.created_at}
                    ${job.study_name ? `&nbsp; <a href="/jobs/${job.id}/optuna-db">download Optuna DB</a>` : ''}
                    ${job.status === 'DONE' ? `&nbsp; <a href="/jobs/${job.id}/download">download results</a>` : ''}
                    ${job.status === 'RUNNING' ? `&nbsp; <a href="/jobs/${job.id}/download">download partial results (job still running)</a>` : ''}
                    ${job.status === 'FAILED' && job.error ? `<pre>${job.error}</pre>` : ''}
                `;
                jobsDiv.appendChild(el);
            });
        }

        document.getElementById('uploadForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            maybeDeleteEmptyFile(form, formData, 'h_vector');
            maybeDeleteEmptyFile(form, formData, 'g_vector');

            msg.textContent = 'Submitting…';
            const res = await fetch('/upload', { method: 'POST', body: formData });
            if (res.ok) {
                msg.textContent = 'Study queued.';
                form.reset();
                refresh();
            } else {
                try {
                    const err = await res.json();
                    msg.textContent = `Upload failed: ${err.error || JSON.stringify(err)}`;
                } catch (_) {
                    msg.textContent = 'Upload failed.';
                }
            }
        });

        refresh();
        setInterval(refresh, 5000);
    </script>
</body>

</html>
