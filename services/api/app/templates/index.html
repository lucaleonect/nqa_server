<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>nqa-server</title>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 1.5rem;
            color: #2e2e2e;
            max-width: 960px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        fieldset {
            border: 1px solid #d0d7de;
            border-radius: 10px;
            padding: 1.1rem 1.2rem;
        }

        legend {
            font-weight: 600;
            padding: 0 0.4rem;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        input[type="file"],
        input[type="text"],
        input[type="number"] {
            font-size: 0.95rem;
            padding: 0.4rem 0.55rem;
            border: 1px solid #bfc3c8;
            border-radius: 6px;
            background: #fff;
        }

        button {
            align-self: flex-start;
            padding: 0.55rem 1.2rem;
            font-size: 0.95rem;
            border-radius: 999px;
            border: 1px solid #0969da;
            background: #0969da;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #ffffff;
        }

        .hint {
            color: #ffffff;
            font-size: 0.88rem;
            margin-top: -0.4rem;
        }

        .job {
            border: 1px solid #d0d7de;
            border-radius: 10px;
            padding: 0.8rem 1.1rem;
            margin: 0.45rem 0;
            font-size: 0.92rem;
        }

        .job strong {
            font-size: 1rem;
        }

        code {
            background: #f6f8fa;
            padding: 0.18rem 0.35rem;
            border-radius: 4px;
        }

        .study-id {
            color: #57606a;
            font-size: 0.85rem;
        }

        @media (max-width: 620px) {
            body {
                margin: 1rem;
            }
        }
    </style>
</head>

<body>
    <h1>nqa-server</h1>
    <form id="uploadForm">
        <fieldset>
            <legend>Problem instance</legend>
            <label>
                J matrix (.npy, required)
                <input type="file" name="file" accept=".npy" required />
            </label>
            <label>
                h vector (.npy, optional)
                <input type="file" name="h_vector" accept=".npy" />
            </label>
            <label>
                g vector (.npy, optional)
                <input type="file" name="g_vector" accept=".npy" />
            </label>
            <label>
                Study name (optional)
                <input type="text" name="study_name" placeholder="choose a unique name" />
            </label>
            <p class="hint">Leave optional vectors blank for zero fields. Studies run with default Optuna settings.</p>
        </fieldset>

        <button type="submit">Start study</button>
    </form>

    <p id="msg"></p>

    <h2>Jobs</h2>
    <div id="jobs"></div>

    <script>
        const jobsDiv = document.getElementById('jobs');
        const msg = document.getElementById('msg');

        const escapeHtml = (value) => {
            if (value === undefined || value === null) {
                return '';
            }
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };

        const maybeDeleteEmptyFile = (form, formData, name) => {
            const input = form.querySelector(`input[name="${name}"]`);
            if (!input) return;
            const file = input.files && input.files[0];
            if (!file || !file.name || file.size === 0) {
                formData.delete(name);
            }
        };

        async function refresh() {
            const res = await fetch('/jobs');
            const data = await res.json();
            jobsDiv.innerHTML = '';
            data.forEach(job => {
                const displayName = job.study_display_name || job.study_name || '';
                const escapedDisplay = escapeHtml(displayName);
                const fallbackName = job.study_display_name && job.study_name && job.study_display_name !== job.study_name
                    ? ` <span class="study-id">(id: ${escapeHtml(job.study_name)})</span>`
                    : '';
                const studyFragment = displayName
                    ? `<code>${escapedDisplay}</code>${fallbackName}`
                    : '<em>assigned automatically</em>';
                const jobIdEncoded = encodeURIComponent(job.id);
                const el = document.createElement('div');
                el.className = 'job';
                el.innerHTML = `
                    <strong>${escapeHtml(job.id)}</strong><br/>
                    study: ${studyFragment} &nbsp; status: <code>${escapeHtml(job.status)}</code> &nbsp; source: ${escapeHtml(job.filename)}<br/>
                    created: ${escapeHtml(job.created_at)}
                    ${job.study_name ? `&nbsp; <a href="/jobs/${jobIdEncoded}/optuna-db">download Optuna DB</a>` : ''}
                    ${job.status === 'DONE' ? `&nbsp; <a href="/jobs/${jobIdEncoded}/download">download results</a>` : ''}
                    ${job.status === 'RUNNING' ? `&nbsp; <a href="/jobs/${jobIdEncoded}/download">download partial results (job still running)</a>` : ''}
                    ${(job.status === 'DONE' || job.status === 'RUNNING') ? `&nbsp; <a href="#" class="dashboard-link" data-job-id="${jobIdEncoded}">open dashboard</a>` : ''}
                    ${job.status === 'FAILED' && job.error ? `<pre>${escapeHtml(job.error)}</pre>` : ''}
                `;
                jobsDiv.appendChild(el);
            });
        }

        document.getElementById('uploadForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            maybeDeleteEmptyFile(form, formData, 'h_vector');
            maybeDeleteEmptyFile(form, formData, 'g_vector');
            const rawName = formData.get('study_name');
            if (typeof rawName === 'string') {
                const trimmed = rawName.trim();
                if (!trimmed) {
                    formData.delete('study_name');
                } else {
                    formData.set('study_name', trimmed);
                }
            }

            msg.textContent = 'Submitting…';
            const res = await fetch('/upload', { method: 'POST', body: formData });
            if (res.ok) {
                msg.textContent = 'Study queued.';
                form.reset();
                refresh();
            } else {
                try {
                    const err = await res.json();
                    msg.textContent = `Upload failed: ${err.error || JSON.stringify(err)}`;
                } catch (_) {
                    msg.textContent = 'Upload failed.';
                }
            }
        });

        refresh();
        setInterval(refresh, 5000);

        jobsDiv.addEventListener('click', async (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) {
                return;
            }
            if (!target.classList.contains('dashboard-link')) {
                return;
            }
            event.preventDefault();
            const jobId = target.dataset.jobId;
            if (!jobId) {
                return;
            }
            target.textContent = 'opening…';
            target.classList.add('disabled');
            try {
                const res = await fetch(`/jobs/${jobId}/dashboard`);
                if (!res.ok) {
                    const payload = await res.json().catch(() => ({}));
                    throw new Error(payload.error || `request failed (${res.status})`);
                }
                const payload = await res.json();
                if (payload.dashboard_url) {
                    window.open(payload.dashboard_url, '_blank');
                } else {
                    throw new Error('dashboard URL missing');
                }
            } catch (err) {
                const msgText = err instanceof Error ? err.message : String(err);
                window.alert(`Unable to open dashboard: ${msgText}`);
            } finally {
                target.textContent = 'open dashboard';
                target.classList.remove('disabled');
            }
        });
    </script>
</body>

</html>
